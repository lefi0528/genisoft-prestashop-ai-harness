name: PrestaShop Harness CI & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Matrix (Node ${{ matrix.node-version }}, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, tokenizer

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Generate Composer Autoload
        run: composer dump-autoload --optimize

      # xargs exits non-zero if any `php -l` fails (find -exec \; would not).
      - name: Lint PHP Syntax
        run: find tools examples projects tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint Smarty Guard
        run: node --check tools/ps-smarty-guard.js

      - name: Guard fixtures (starters must fail, solutions and example must pass)
        run: bash tests/fixtures.sh

      - name: Project 02 solution runtime smoke test
        run: php tests/project-02-solution-smoke.php

      - name: Audit the example module
        run: bash tools/audit-harness.sh examples/genisoft_cartthreshold

  example-module-lint:
    name: Example module syntax (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PrestaShop 1.7.8 runs on PHP 7.1-7.4; PrestaShop 9.x on PHP 8.1+.
        php-version: ['7.1', '7.4', '8.1', '8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Lint example module
        run: find examples -name '*.php' -print0 | xargs -0 -n1 php -l
